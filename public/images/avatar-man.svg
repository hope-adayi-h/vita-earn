<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D5B8" />
      <stop offset="100%" stop-color="#E5B892" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2616" />
      <stop offset="100%" stop-color="#1F140A" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4D0F" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGrad)" />

  <!-- Shoulders & Shirt -->
  <path d="M22 128 C24 96, 44 86, 64 86 C84 86, 104 96, 106 128 Z" fill="url(#shirtGrad)" />
  <!-- Collar -->
  <polygon points="64,102 54,86 74,86" fill="#FFFFFF" />

  <!-- Neck -->
  <rect x="55" y="70" width="18" height="20" rx="4" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="64" cy="54" rx="24" ry="28" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="39" cy="54" r="5" fill="#E5B892" />
  <circle cx="89" cy="54" r="5" fill="#E5B892" />

  <!-- Hair -->
  <path d="M40 48 C40 30, 48 24, 64 24 C80 24, 88 30, 88 48 C85 40, 78 35, 64 35 C50 35, 43 40, 40 48 Z" fill="url(#hairGrad)" />

  <!-- Eyes -->
  <circle cx="53" cy="52" r="3" fill="#1F140A" />
  <circle cx="75" cy="52" r="3" fill="#1F140A" />

  <!-- Eyebrows -->
  <path d="M48 46 Q53 43 58 46" stroke="#1F140A" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M70 46 Q75 43 80 46" stroke="#1F140A" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M64 53 L62 60 L66 60" stroke="#C89772" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Smile -->
  <path d="M56 66 Q64 72 72 66" stroke="#C89772" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
